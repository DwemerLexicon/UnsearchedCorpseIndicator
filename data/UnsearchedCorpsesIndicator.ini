; Unsearched Corpse Indicator Settings
;
; fDelay - Seconds to wait after a kill before showing the icon (default: 0)
fDelay = 0

; bAllCorpses - Show icons on all dead NPCs, not just ones killed by you or followers (default: 1)
; 0 = player/follower kills only, 1 = all corpses
bAllCorpses = 1

; iToggleKey - DirectX scan code for toggling corpse icons on/off (default: 38 = L)
; you can go here to view key scancodes https://geckwiki.com/index.php?title=DirectX_Scancodes
; Set to 0 to disable the hotkey
iToggleKey = 38

; iToggleModifier - Key that must be held with iToggleKey, e.g. 42 = Left Shift, 29 = Left Ctrl, 56 = Left Alt (default: 0)
; Set to 0 to toggle with iToggleKey alone
iToggleModifier = 0

; fFadeStartDistance - Distance at which the icon starts fading out (default: 1000)
fFadeStartDistance = 1000

; fFadeMaxDistance - Distance at which the icon has fully faded out. Increase it to see icons from farther away (default: 1500)
fFadeMaxDistance = 1500

; iMaxIcons - Most icons shown at once, from 1 to 100 (default: 48)
iMaxIcons = 48

; fScale - Icon size, e.g. 0.6 is smaller and 1.5 is larger (default: 1.0)
fScale = 1.0

; iOpacity - How solid the icon is, from 0 (invisible) to 100. It still fades with distance (default: 100)
iOpacity = 100

; bFixedSize - Keep the icon the same size at any distance instead of shrinking as it gets further away (default: 0)
; 0 = shrinks with distance, 1 = same size at any distance
bFixedSize = 0

; sColor - Tint the icon with a hex colour, e.g. FF4444 for red. The colour is multiplied with the icon,
; so FFFFFF leaves it unchanged. Leave it blank for no tint (default: blank)
sColor =
